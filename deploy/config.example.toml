# OmniBedrock configuration file.
#
# Locations searched (first match wins, never merged):
#   1. the file given via --config
#   2. <executable dir>/config.toml
#   3. ~/.config/omnibedrock/config.toml   (Linux; XDG_CONFIG_HOME honored)
# In --portable mode only <executable dir>/data/config.toml is read.
#
# Data root resolution (highest wins):
#   --portable / portable = true          → <executable dir>/data/
#   --global-data-dir / global_data_dir   → the given directory
#   default                               → ~/.local/share/omnibedrock (Linux),
#                                           %LOCALAPPDATA%\OmniBedrock (Windows)
# Setting both keys in one file is an error; CLI flags beat file settings.
#
# Precedence for everything else (lowest to highest):
#   defaults → this file → environment → CLI flags
#
# Secrets (SECRET_KEY, CURSEFORGE_API_KEY, ADMIN_PASSWORD) are NOT read from
# this file — put them in the environment or a .env file next to the binary.

# ── data root ──────────────────────────────────────────────────────────────
# portable = true                        # everything under <exe dir>/data/
# global_data_dir = "/srv/omnibedrock"   # custom root (relative → this file's dir)

# ── network ────────────────────────────────────────────────────────────────
# host = "0.0.0.0"
# port = 17754
# api_prefix = "/api/v1"
# cors_origins = ["http://localhost:17755", "http://localhost:5173"]

# ── storage paths (defaults derive from the data root; relative paths
#    resolve against the working directory) ──────────────────────────────────
# bedrock_server_dir = "<root>/server"     # game server + its worlds/
# data_dir           = "<root>"            # accounts, toolchains, caches, settings
# logs_dir           = "<root>/logs"       # panel + audit logs
# backups_dir        = "<root>/backups"    # world backups
# cache_dir          = "<root>/cache"      # defaults to <data_dir>/cache

# ── server backends ────────────────────────────────────────────────────────
# endstone_bin     = "/path/to/endstone"    # overrides the panel-managed toolchain
# endstone_python  = "/path/to/python"      # legacy fallback; must import endstone
# broadcaster_dir  = "<root>/broadcaster"
# broadcaster_jar  = "/path/to/MCXboxBroadcastStandalone.jar"
# java_bin         = "/usr/bin/java"

# ── docker runtime images (auto-built when missing, unless custom) ─────────
# docker_image_vanilla  = "omnibedrock-vanilla:latest"
# docker_image_endstone = "omnibedrock-endstone:latest"

# ── privileged capabilities (both default to false) ────────────────────────
# Docker bind mounts are arbitrary host filesystem access; when enabled only
# the panel owner may configure them.
# docker_allow_host_mounts = false
# Backup pre/post `command` hooks run arbitrary shell as the panel user;
# send/wait/comment hooks work without this.
# backup_hooks_enabled = false

# ── tuning ─────────────────────────────────────────────────────────────────
# debug = false
# ws_heartbeat_interval = 30
# console_max_lines = 2000
# console_max_bytes = 16777216
# console_max_line_bytes = 65536
# console_journal_bytes = 268435456
# command_queue_capacity = 256
