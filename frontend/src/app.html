<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <!-- Self-hosted fonts (static/fonts): no external CDN, works air-gapped
         and satisfies the panel's CSP (font-src 'self'). -->
    <link href="/fonts/fonts.css" rel="stylesheet">
    <script>
      // Apply the saved theme before first paint so the app never flashes the
      // wrong palette. Keys/values are managed by src/lib/theme.ts (JSON).
      // The custom-accent ramp below is a byte-equivalent copy of theme.ts's
      // accentRamp() — keep the two in sync.
      (function () {
        try {
          var parse = function (raw) { try { return JSON.parse(raw); } catch (e) { return undefined; } };
          var read = function (key, guard, fallback) {
            var v = parse(localStorage.getItem(key));
            return guard(v) ? v : fallback;
          };
          var themes = ['cyan', 'minecraft', 'blue', 'purple', 'emerald', 'lime', 'amber', 'orange', 'red', 'rose', 'pink', 'fuchsia', 'indigo', 'sky', 'teal', 'slate', 'custom'];
          var themeId = read('omb.theme', function (v) { return themes.indexOf(v) !== -1; }, 'cyan');
          var mode = read('omb.theme-mode', function (v) { return v === 'dark' || v === 'light' || v === 'system'; }, 'dark');
          var resolved = mode;
          if (mode === 'system') {
            resolved = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          var root = document.documentElement;
          root.setAttribute('data-theme', themeId);
          root.setAttribute('data-mode', resolved);
          if (resolved === 'dark') root.classList.add('dark');
          if (themeId === 'custom') {
            var hex = read('omb.theme-custom-hex', function (v) { return typeof v === 'string' && /^#[0-9a-fA-F]{6}$/.test(v); }, '#38bdf8');
            var r0 = parseInt(hex.slice(1, 3), 16) / 255, g0 = parseInt(hex.slice(3, 5), 16) / 255, b0 = parseInt(hex.slice(5, 7), 16) / 255;
            var mx = Math.max(r0, g0, b0), mn = Math.min(r0, g0, b0), li = (mx + mn) / 2, h = 0, sat = 0;
            if (mx !== mn) {
              var d = mx - mn;
              sat = li > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
              if (mx === r0) h = (g0 - b0) / d + (g0 < b0 ? 6 : 0);
              else if (mx === g0) h = (b0 - r0) / d + 2;
              else h = (r0 - g0) / d + 4;
              h *= 60;
            }
            var Ls = [0.97, 0.94, 0.86, 0.76, 0.66, 0.56, 0.48, 0.41, 0.34, 0.28, 0.20];
            var Ss = [0.35, 0.5, 0.75, 0.9, 0.95, 1, 1, 1, 1, 1, 1];
            var stops = ['50', '100', '200', '300', '400', '500', '600', '700', '800', '900', '950'];
            for (var i = 0; i < 11; i++) {
              var c = (1 - Math.abs(2 * Ls[i] - 1)) * sat * Ss[i];
              var hp = ((h % 360) + 360) % 360 / 60;
              var x = c * (1 - Math.abs(hp % 2 - 1));
              var r = 0, g = 0, b = 0;
              if (hp < 1) { r = c; g = x; } else if (hp < 2) { r = x; g = c; }
              else if (hp < 3) { g = c; b = x; } else if (hp < 4) { g = x; b = c; }
              else if (hp < 5) { r = x; b = c; } else { r = c; b = x; }
              var m2 = Ls[i] - c / 2;
              var t = function (v) { return Math.round(Math.min(255, Math.max(0, (v + m2) * 255))); };
              root.style.setProperty('--bedrock-' + stops[i], t(r) + ' ' + t(g) + ' ' + t(b));
            }
          }
          var density = read('omb.ui-density', function (v) { return v === 'comfortable' || v === 'compact'; }, 'comfortable');
          root.setAttribute('data-density', density);
          var scale = read('omb.ui-font-scale', function (v) { return typeof v === 'number' && v >= 0.9 && v <= 1.2; }, 1);
          root.style.fontSize = Math.round(scale * 100) + '%';
        } catch (e) {}
      })();
    </script>
    %sveltekit.head%
  </head>
  <body>
    <div id="app">%sveltekit.body%</div>
  </body>
</html>
