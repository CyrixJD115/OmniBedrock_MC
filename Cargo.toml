[workspace]
members = [
    "backend/omnibedrock-core",
    "backend/omnibedrock-server",
    "backend/omnibedrock-api",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
rust-version = "1.90"

[workspace.dependencies]
omnibedrock-core = { path = "backend/omnibedrock-core" }
omnibedrock-server = { path = "backend/omnibedrock-server" }
anyhow = "1"
argon2 = "0.5"
axum = { version = "0.8", features = ["ws", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
flate2 = "1"
futures-util = "0.3"
hex = "0.4"
include_dir = "0.7"
jsonwebtoken = { version = "9", default-features = false }
mime_guess = "2"
pbkdf2 = "0.12"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "gzip"] }
secrecy = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
subtle = "2"
sysinfo = "0.33"
tar = "0.4"
tauri = "2"
thiserror = "2"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip", "normalize-path", "set-header"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
nix = { version = "0.29", features = ["signal", "process", "fs", "user"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = "0.26"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
