[project]
name = "omnibedrock-mc"
version = "0.1.0"
description = "Modern web-based Minecraft Bedrock server control panel"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=14.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-multipart>=0.0.12",
    "python-dateutil>=2.9",
    "watchdog>=4.0.0",
    "aiofiles>=24.0",
    "psutil>=6.0.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
