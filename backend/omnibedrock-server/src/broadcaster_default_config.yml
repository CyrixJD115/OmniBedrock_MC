# Core session settings
session:
  # ── OFFER-RELAY TARGET (operational) ─────────────────────────────────────
  # Where join offers received over Xbox Live are relayed to, and the address
  # joining clients are handed for the NetherNet handshake. The panel runs
  # the broadcaster on the SAME host as the server, so this must stay the
  # loopback address — Endstone advertises its own public address to clients.
  # NEVER put a public IP here: routers refuse the hairpin loop and every
  # friends-list join fails with "Failed to relay offer ... connection
  # refused" (client-side InitialConnection-81).
  remote-address: 127.0.0.1

  # The port of the server to relay joins to — the instance's server-port
  # (seeded automatically by the panel for fresh configs).
  remote-port: {{PORT}}

  # The amount of time in seconds to update session information
  # Warning: This can be no lower than 20 due to Xbox rate limits
  update-interval: 30

  # Should we query the bedrock server to sync the session information
  query-server: true

  # This uses checker.geysermc.org for querying if the native ping fails
  # This can be useful in the case of docker networks or routing problems causing the native ping to fail
  web-query-fallback: false

  # Fallback to config values if all other server query methods fail
  config-fallback: false

  # The data to broadcast over xbox live, this is the default if querying is
  # enabled. The live player/world values are synced from the server through
  # the query ping above.
  session-info:
    # The host name to broadcast
    host-name: OmniBedrock Server

    # The world name to broadcast
    world-name: OmniBedrock

    # The game mode to broadcast (Survival, Creative, Adventure)
    game-mode: Survival

    # The current number of players (fallback when querying is off/failing)
    players: 0

    # The maximum number of players (fallback when querying is off/failing)
    max-players: 20

  # When the session fills up a new one is created and the old one is closed
  # true: Players in the old session lose the friends of friends tag, so their friends can't see the server
  # false: Players in the old session keep the friends of friends tag, but their friends get an error when trying to join
  hide-old-sessions: true

# Friend list sync settings
friend-sync:
  # The amount of time in seconds to update session information
  # Warning: This can be no lower than 20 due to Xbox rate limits
  update-interval: 60

  # Should we automatically accept friend requests
  auto-friend: true

  # Should we automatically send an invite when a friend is added
  initial-invite: true

  # Friend expiry settings
  expiry:
    # Should we unfriend people that haven't joined the server in a while
    enabled: true

    # The amount of time in days before a friend is considered expired
    days: 15

    # How often to check in seconds for expired friends
    check: 1800

# Notification settings (e.g., Slack/Discord webhook)
notifications:
  # Should we send a message to a slack webhook when the session is updated
  enabled: false

  # The webhook url to send the message to
  # If you are using discord add "/slack" to the end of the webhook url
  webhook-url: ''

  # The message to send when the session is expired and needs to be updated
  session-expired-message: |-
    <!here> Xbox Session expired, sign in again to update it.

    Use the following link to sign in: %s
    Enter the code: %s

  # The message to send when a friend has restrictions in place that prevent them from being friends with our account
  friend-restriction-message: '%s (%s) has restrictions in place that prevent them from being friends with our account.'

# Enable debug logging
debug-mode: false

# Suppresses "Updated session!" log into debug
suppress-session-update-message: false

# Do not change!
config-version: 7
