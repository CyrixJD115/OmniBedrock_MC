[package]
name = "omnibedrock-api"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "OmniBedrock control panel: axum routes, WebSocket handlers, and authentication"

[features]
default = []
# Links WebKit/GTK and adds the `--desktop` Tauri window mode.
desktop = ["dep:tauri"]

[dependencies]
omnibedrock-core.workspace = true
omnibedrock-server.workspace = true
anyhow.workspace = true
argon2.workspace = true
axum.workspace = true
chrono.workspace = true
clap.workspace = true
dotenvy.workspace = true
futures-util.workspace = true
hex.workspace = true
include_dir.workspace = true
jsonwebtoken.workspace = true
mime_guess.workspace = true
pbkdf2.workspace = true
rand.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
subtle.workspace = true
tauri = { workspace = true, optional = true }
tokio.workspace = true
tokio-util.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
walkdir.workspace = true

[[bin]]
name = "omnibedrock"
path = "src/main.rs"

[dev-dependencies]
tempfile.workspace = true
tokio-tungstenite.workspace = true
tower.workspace = true
zip.workspace = true
